<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>9월 2주차 연출가이드</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Swiper.js CSS (모바일 터치 슬라이더 & 핀치 줌) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <!-- 구글 Noto Sans KR 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* 모바일 브라우저 주소창 고려 높이 */
    .viewport-height {
      height: 100dvh;
    }
    /* Swiper 핀치 줌 영역 스타일 */
    .swiper-slide {
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
    }
    .swiper-zoom-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .swiper-zoom-container > img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
    }
    /* 스크롤바 숨기기 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-white viewport-height flex flex-col overflow-hidden">

  <!-- [상단 헤더] 고정 네비게이션 -->
  <header class="h-14 bg-slate-900/95 backdrop-blur border-b border-slate-800 flex items-center justify-between px-4 z-30 shrink-0">
    <div>
      <h1 class="text-base font-bold text-slate-100 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
        9월 2주차 연출가이드
      </h1>
      <p class="text-[11px] text-slate-400">매장 표준 연출 가이드 (총 40컷)</p>
    </div>

    <!-- 뷰 모드 전환 버튼 & 바로가기 -->
    <div class="flex items-center gap-2">
      <!-- 번호 선택 드롭다운 -->
      <select id="jumpSelect" class="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded-lg px-2 py-1.5 focus:outline-none focus:border-blue-500">
        <!-- JS로 1~40 옵션 자동 생성 -->
      </select>

      <!-- 모아보기 토글 버튼 -->
      <button id="viewToggleBtn" class="bg-blue-600 hover:bg-blue-500 text-xs font-semibold px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition-all active:scale-95">
        <svg id="gridIcon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
        </svg>
        <span id="viewToggleText">모아보기</span>
      </button>
    </div>
  </header>

  <!-- [메인 콘텐츠 영역] -->
  <main class="relative flex-1 w-full overflow-hidden bg-slate-950">
    
    <!-- 1. 슬라이더 뷰 (기본 모드 : 핀치줌 & 스와이프) -->
    <div id="sliderView" class="h-full w-full">
      <div class="swiper mySwiper h-full w-full">
        <div class="swiper-wrapper" id="swiperWrapper">
          <!-- 1번~40번 슬라이드가 자바스크립트로 자동 삽입됩니다 -->
        </div>

        <!-- 좌우 화살표 (태블릿/PC 및 터치 편의) -->
        <button class="swiper-button-prev !text-white/60 !w-8 !h-8 after:!text-xl hidden sm:flex"></button>
        <button class="swiper-button-next !text-white/60 !w-8 !h-8 after:!text-xl hidden sm:flex"></button>
      </div>

      <!-- 상단 확대 안내 팁 (3초 후 서서히 사라짐) -->
      <div id="zoomGuideToast" class="absolute top-3 left-1/2 -translate-x-1/2 z-20 bg-black/75 backdrop-blur px-3 py-1.5 rounded-full text-[11px] text-slate-300 pointer-events-none flex items-center gap-1.5 shadow-lg transition-opacity duration-700">
        <span>✌️ 두 손가락으로 사진 확대 / 더블탭 확대 가능</span>
      </div>
    </div>

    <!-- 2. 전체 모아보기 그리드 뷰 (숨김 기본) -->
    <div id="gridView" class="hidden h-full w-full overflow-y-auto p-3 no-scrollbar">
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5" id="gridContainer">
        <!-- 40개 썸네일 카드가 자바스크립트로 자동 생성됩니다 -->
      </div>
    </div>

  </main>

  <!-- [하단 컨트롤러 바] -->
  <footer class="h-12 bg-slate-900/90 border-t border-slate-800 flex items-center justify-between px-4 z-30 shrink-0">
    <!-- 이전 버튼 -->
    <button id="prevBtn" class="text-xs font-semibold px-3 py-1.5 rounded-md bg-slate-800 text-slate-300 active:bg-slate-700 flex items-center gap-1">
      ◀ 이전
    </button>

    <!-- 현재 페이지 카운터 -->
    <div class="text-xs font-bold text-slate-300">
      <span id="currentPageNum" class="text-blue-400 text-sm">1</span> / <span id="totalPageNum">40</span>
    </div>

    <!-- 다음 버튼 -->
    <button id="nextBtn" class="text-xs font-semibold px-3 py-1.5 rounded-md bg-blue-600 text-white active:bg-blue-700 flex items-center gap-1">
      다음 ▶
    </button>
  </footer>

  <!-- Swiper.js 스크립트 -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <script>
    const TOTAL_IMAGES = 40;
    // GitHub 원본 이미지 기본 경로
    const BASE_IMAGE_URL = 'https://raw.githubusercontent.com/jeongkisun/010101010/refs/heads/main/images/%EC%9D%B4%EB%AF%B8%EC%A7%80%20';

    const swiperWrapper = document.getElementById('swiperWrapper');
    const gridContainer = document.getElementById('gridContainer');
    const jumpSelect = document.getElementById('jumpSelect');
    const currentPageNum = document.getElementById('currentPageNum');
    const totalPageNum = document.getElementById('totalPageNum');
    const viewToggleBtn = document.getElementById('viewToggleBtn');
    const viewToggleText = document.getElementById('viewToggleText');
    const sliderView = document.getElementById('sliderView');
    const gridView = document.getElementById('gridView');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    totalPageNum.textContent = TOTAL_IMAGES;

    // 1. 1번부터 40번까지 슬라이드, 그리드, 드롭다운 동적 생성
    for (let i = 1; i <= TOTAL_IMAGES; i++) {
      const imgUrl = `${BASE_IMAGE_URL}(${i}).jfif`;

      // (1) 드롭다운 옵션
      const option = document.createElement('option');
      option.value = i - 1;
      option.textContent = `${i}번 가이드`;
      jumpSelect.appendChild(option);

      // (2) Swiper 슬라이드 생성 (양손가락 핀치 줌을 위한 swiper-zoom-container)
      const slide = document.createElement('div');
      slide.className = 'swiper-slide';
      slide.innerHTML = `
        <div class="swiper-zoom-container">
          <img 
            src="${imgUrl}" 
            alt="가이드 이미지 ${i}" 
            loading="lazy"
            onerror="handleImgError(this, ${i})"
          />
        </div>
      `;
      swiperWrapper.appendChild(slide);

      // (3) 그리드 썸네일 카드 생성
      const gridCard = document.createElement('div');
      gridCard.className = 'bg-slate-900 border border-slate-800 rounded-lg overflow-hidden cursor-pointer active:scale-95 transition-transform relative aspect-[4/3] flex flex-col justify-end';
      gridCard.onclick = () => jumpToSlide(i - 1);
      gridCard.innerHTML = `
        <img 
          src="${imgUrl}" 
          alt="썸네일 ${i}" 
          class="absolute inset-0 w-full h-full object-cover" 
          loading="lazy"
          onerror="handleThumbnailError(this, ${i})"
        />
        <div class="relative z-10 bg-gradient-to-t from-black/90 via-black/40 to-transparent p-1.5 text-center">
          <span class="text-[11px] font-bold text-white bg-blue-600/80 px-1.5 py-0.5 rounded">${i}번</span>
        </div>
      `;
      gridContainer.appendChild(gridCard);
    }

    // 아직 업로드되지 않은 이미지가 있을 경우 보여주는 안내 UI
    function handleImgError(imgElement, index) {
      imgElement.onerror = null;
      const parent = imgElement.parentElement;
      parent.innerHTML = `
        <div class="flex flex-col items-center justify-center text-slate-500 p-6 text-center">
          <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center mb-3 text-slate-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
          </div>
          <span class="text-sm font-semibold text-slate-300 mb-1">${index}번 이미지 준비 중</span>
          <span class="text-xs text-slate-500">이미지가 업로드되면 자동으로 표시됩니다.</span>
        </div>
      `;
    }

    function handleThumbnailError(imgElement, index) {
      imgElement.onerror = null;
      imgElement.style.display = 'none';
      imgElement.parentElement.classList.add('bg-slate-800', 'items-center', 'justify-center');
    }

    // 2. Swiper 초기화 (핀치 줌 & 모바일 제스처 최적화)
    const swiper = new Swiper('.mySwiper', {
      zoom: {
        maxRatio: 4,       // 최대 4배까지 핀치 줌 확대
        minRatio: 1,
        toggle: true,      // 더블 탭으로 확대/축소
      },
      loop: false,
      lazy: {
        loadPrevNext: true,
        loadPrevNextAmount: 2, // 앞뒤 2장 미리 로딩해 로딩 지연 최소화
      },
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
      keyboard: {
        enabled: true,
      },
      on: {
        slideChange: function () {
          const index = this.activeIndex;
          currentPageNum.textContent = index + 1;
          jumpSelect.value = index;
        }
      }
    });

    // 3. 컨트롤러 이벤트 연결
    prevBtn.addEventListener('click', () => swiper.slidePrev());
    nextBtn.addEventListener('click', () => swiper.slideNext());

    jumpSelect.addEventListener('change', (e) => {
      swiper.slideTo(parseInt(e.target.value));
      switchToSliderView();
    });

    function jumpToSlide(index) {
      swiper.slideTo(index);
      switchToSliderView();
    }

    // 4. 슬라이드 뷰 ↔ 그리드 모아보기 전환 로직
    let isGridView = false;

    viewToggleBtn.addEventListener('click', () => {
      if (!isGridView) {
        // 그리드 모드로 전환
        sliderView.classList.add('hidden');
        gridView.classList.remove('hidden');
        viewToggleText.textContent = '슬라이드';
        isGridView = true;
      } else {
        switchToSliderView();
      }
    });

    function switchToSliderView() {
      gridView.classList.add('hidden');
      sliderView.classList.remove('hidden');
      viewToggleText.textContent = '모아보기';
      isGridView = false;
      swiper.update(); // 크기 재계산
    }

    // 5. 줌 안내 툴팁 3초 뒤 페이드아웃
    setTimeout(() => {
      const toast = document.getElementById('zoomGuideToast');
      if (toast) {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 700);
      }
    }, 3200);
  </script>
</body>
</html>
